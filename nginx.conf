server {
    listen 80;
    server_name localhost;

    # Allow file/attachment uploads up to the backend's own cap
    # (multer: 10 MB/file × 5 files — see attachments.controller.ts).
    # Without this, nginx's 1 MB default returns 413 Request Entity Too
    # Large before the request ever reaches Node — which is why uploads
    # worked locally (no nginx) but failed on the live server.
    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
